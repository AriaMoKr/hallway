# Publishes the hallway to GitHub Pages on every push to main, or by hand, through common's workflow
# (AriaMoKr/common's README, "The Pages workflow"): npm ci, which copies the vendor modules into
# public/vendor/, npm test, then public/ as it is.
#
# One-time setup: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: AriaMoKr/common/.github/workflows/pages.yml@v0.5.0
